[package]
name = "merkle-core"
version = "0.1.0"
edition = "2021"
description = "Canonical receipt hashing and sorted-pair Merkle trees shared by the Proven Stylus contract and TS SDK"

[dependencies]
alloy-primitives = { version = "0.8", default-features = false, features = ["tiny-keccak", "serde"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
hex = "0.4"

[dev-dependencies]
rand = "0.8"
