name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - name: architecture (dependency-cruiser)
        run: pnpm exec depcruise sdk/src indexer/src web/lib web/app --config .dependency-cruiser.cjs
      - name: coverage floors (sdk 75, indexer 95)
        run: |
          npx c8 --check-coverage --lines 75 --include "sdk/dist/src/**/*.js" node --test "sdk/dist/test/*.test.js"
          npx c8 --check-coverage --lines 95 --include "indexer/dist/src/**/*.js" node --test "indexer/dist/test/*.test.js"
      - run: pnpm --filter @covenant/web run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: merkle-core tests
        working-directory: contracts/merkle-core
        run: cargo test
      - name: contract tests
        working-directory: contracts/covenant
        run: cargo test
      - name: wasm32 release build
        working-directory: contracts/covenant
        run: cargo build --release --target wasm32-unknown-unknown

  vouch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install agent + tooling
        run: pip install httpx pydantic-settings ruff mypy coverage import-linter
      - name: ruff lint + format check
        working-directory: vouch
        run: |
          ruff check vouch tests
          ruff format --check vouch tests
      - name: mypy
        working-directory: vouch
        run: mypy vouch
      - name: import-linter layering contracts
        working-directory: vouch
        run: python3 -m importlinter.cli --config pyproject.toml lint
      - name: coverage floors (package 50, attest core 85)
        working-directory: vouch
        run: |
          python3 -m coverage run -m unittest discover -s tests
          python3 -m coverage report --fail-under=40 | tail -1
          python3 -m coverage report --include="vouch/attest/*" --fail-under=85 | tail -1
      - name: attestation conformance tests
        working-directory: vouch
        run: python3 -m unittest discover -s tests -v
