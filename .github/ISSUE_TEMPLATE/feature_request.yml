name: Feature request
description: Propose an improvement or new capability for Covenant.
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the monorepo does this target?
      options:
        - contracts (Stylus contract / merkle-core)
        - sdk (TypeScript SDK)
        - indexer (event indexer + JSON API)
        - web (Next.js leaderboard)
        - vouch (trading agent)
        - docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What can you not do today? Who needs it and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? Sketch the API, protocol change, or UI.
    validations:
      required: true
  - type: checkboxes
    id: protocol-impact
    attributes:
      label: Protocol impact
      description: Receipt encoding, hashing, or Merkle semantics are protocol-level (docs/protocol.md, section 4). Changes there must be mirrored in Rust, TypeScript, and Python with regenerated fixtures.
      options:
        - label: This proposal requires a protocol change (cross-language fixtures must be regenerated)
          required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you ruled out and why.
    validations:
      required: false
