[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vouch"
version = "0.1.0"
description = "Self-rewriting, covenant-attested paper-to-live trading loop"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    # vouch.server.app mounts a FastAPI dashboard; fastapi is imported by the
    # installable package, so it must be declared (uvicorn runs it, below).
    "fastapi>=0.110",
]
# uvicorn and websockets are runner/dashboard extras, not package imports.
[project.optional-dependencies]
dev = ["ruff>=0.8", "mypy>=1.13", "websockets", "uvicorn>=0.29"]

[tool.hatch.build.targets.wheel]
packages = ["vouch"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# tests/attest/test_attest.py: conformance fixtures drive long parameter lists;
# keeping the fixture-driven call sites under 100 chars would obscure what is
# asserted. E501 only; everything else in tests is held to the same rules.
"tests/attest/test_attest.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true

# Third-party modules imported lazily inside functions; none ship type info
# and none are required at import time (optional providers / dashboard deps).
[[tool.mypy.overrides]]
module = ["laya", "laya.*", "websockets", "websockets.*", "jwt", "cryptography", "cryptography.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

# vouch/server/app.py: FastAPI glue around dynamic JSON dicts loaded from
# out/ui/config.json and run directories; typing the whole request/response
# surface would add ceremony without safety for a localhost-only tool.
[[tool.mypy.overrides]]
module = "vouch.server.*"
disallow_untyped_defs = false

# tests/*: unittest fixtures and mocks are dynamic by nature (mock.patch,
# env matrices, JSON fixtures); annotations there would test the test rig.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

